# Normal Shoes 3 (v4) — static site, published from the repo root.
[build]
  publish = "."

[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=604800"

[[headers]]
  for = "/data/*"
  [headers.values]
    Cache-Control = "public, max-age=300"

# Old v3 URLs folded into the v4 structure
[[redirects]]
  from = "/brighton-rocks"
  to = "/for-festivals"
  status = 301
[[redirects]]
  from = "/hastings-rocks"
  to = "/for-festivals"
  status = 301
[[redirects]]
  from = "/submission-requirements"
  to = "/submit"
  status = 301
[[redirects]]
  from = "/package-tiers"
  to = "/studio"
  status = 301
[[redirects]]
  from = "/archive"
  to = "/releases"
  status = 301
[[redirects]]
  from = "/archive-brimful-bellies"
  to = "/releases"
  status = 301

[functions]
  directory = "netlify/functions"
  node_bundler = "esbuild"
